{% extends 'base.html' %}
{% block title %}403 没有权限{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="error-card">
    <span class="error-emoji">🔒</span>
    <div class="error-code">403</div>
    <h1 class="error-title">{{ message or '没有权限访问该资源' }}</h1>
    <p class="error-desc">
      这个页面需要更高权限，或者你访问的是别人的数据。
      请确认登录的账号是否正确，或返回首页继续使用自己的账本。
    </p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{{ url_for('ledger.index') }}">返回首页</a>
      <a class="btn btn-soft" href="{{ url_for('auth.login') }}">重新登录</a>
    </div>
  </div>
</div>
{% endblock %}
